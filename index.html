<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuickNotes - Record, Transcribe, Summarize, Study</title>
  <meta name="description" content="QuickNotes turns your lectures and meetings into transcripts, AI summaries, flashcards and quizzes on iPhone.">
  <style>
    :root { --blue:#2e7cf6; --bg:#f4f6fb; --text:#111827; --muted:#6b7280; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0b0d12; --text:#f3f4f6; --muted:#9ca3af; } }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
           font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
           background:var(--bg); color:var(--text); text-align:center; }
    main { max-width:560px; }
    h1 { font-size:clamp(2rem,6vw,3rem); margin:0 0 12px; }
    p { color:var(--muted); font-size:1.125rem; line-height:1.6; margin:0 0 24px; }
    a { color:var(--blue); }
  </style>
</head>
<body>
  <main>
    <h1>QuickNotes</h1>
    <p>Record a lecture or meeting. Get a transcript, an AI summary, then flashcards and a quiz to study from. Coming soon to the App Store.</p>
    <p><a href="mailto:support@quicknotesapp.io">support@quicknotesapp.io</a></p>
  </main>
</body>
</html>
